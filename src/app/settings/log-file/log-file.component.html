<div class="log-file-card" *ngIf="!showSettings">
    <p class="warning-text">Changing any settings in this section may drastically alter your performance.</p>

    <mat-checkbox [(ngModel)]="showSettings" name="showSettings">Show log file settings</mat-checkbox>
</div>
<div class="log-file-grid" *ngIf="showSettings">
    <div>
        <h4>Read settings</h4>
        <div class="slider-label">
            <span>Read delay</span>
            <small>How often should Nag check for new log entries.</small>
        </div>
        <mat-slider [(ngModel)]="readDelay" thumbLabel step="10" tickInterval="1" min="50" max="1000" style="width: 100%;" (change)="onSettingsChanged()" ></mat-slider>
        <!-- <div class="flex-row">
            <span>Flush Delay</span>
            <span class="spacer"></span>
            <small>How often to flush cached log files.</small>
        </div>
        <mat-slider [(ngModel)]="flushDelay" thumbLabel step="10" tickInterval="1" min="50" max="1000" style="width: 100%;" (change)="onSettingsChanged()" ></mat-slider> -->
    </div>
    <div>
        <h4>Error settings</h4>
        <div class="slider-label">
            <span>Error delay</span>
            <small>How long to wait before retrying a read operation after an error.</small>
        </div>
        <mat-slider [(ngModel)]="readErrorDelay" thumbLabel step="10" tickInterval="1" min="50" max="1000" style="width: 100%;" (change)="onSettingsChanged()" ></mat-slider>
    </div>
</div>
<div class="log-file-actions" *ngIf="showSaveButton">
    <button mat-stroked-button (click)="cancelSettings()">Cancel</button>
    <button mat-flat-button color="primary" (click)="saveSettings()">Save changes</button>
</div>
