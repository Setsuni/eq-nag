<mat-toolbar>
    <span>Overlays</span>
    <span class="spacer"></span>
    <button mat-button color="default" (click)="arrangeOverlays()"><mat-icon class="material-icons-outlined">view_quilt</mat-icon> Arrange overlays</button>
    <button mat-button color="accent" (click)="showNewOverlayDialog()"><mat-icon>add</mat-icon> New overlay</button>
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More overlay actions">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="trigger-main-menu">
        <button mat-menu-item (click)="findMissingOverlays()" matTooltip="Will find any references to overlays that do not exist in your list of overlays." matTooltipPosition="left">
            <span>Find missing overlays</span>
        </button>
    </mat-menu>
</mat-toolbar>
<div class="tab-content">

    <div class="empty-state" *ngIf="overlaysLoaded && overlays?.length === 0">
        <h2>No overlays yet</h2>
        <p>Overlays are the windows on your screen where trigger text, timers and bars show up.</p>
        <button mat-button color="accent" (click)="showNewOverlayDialog()"><mat-icon>add</mat-icon> New overlay</button>
    </div>

    <div class="overlays-layout" *ngIf="overlays?.length > 0">
        <div class="map-column">
            <app-overlay-map [overlays]="overlays" [selectedOverlayId]="selectedOverlayId" (overlaySelected)="selectedOverlayId = $event" (overlayMoved)="moveOverlay( $event )"></app-overlay-map>
        </div>

        <table mat-table #overlaysTable="matTable" class="overlay-table" [dataSource]="overlays">

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let element; let i = index"> {{element.name}} </td>
            </ng-container>

            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> Type </th>
                <td mat-cell *matCellDef="let element; let i = index"><span class="type-dot" [ngClass]="getOverlayTypeClass( element.overlayType )"></span> {{getOverlayTypeLabel(element.overlayType)}} </td>
            </ng-container>

            <ng-container matColumnDef="assignCount">
                <th mat-header-cell *matHeaderCellDef class="count-cell"> Used by </th>
                <td mat-cell *matCellDef="let element; let i = index" class="count-cell">
                    <ng-template [ngIf]="element.overlayType === 'FCT'" [ngIfElse]="normalOverlay">&ndash;</ng-template>
                    <ng-template #normalOverlay>{{overlayAssignCounts[element.overlayId] ?? 0}}</ng-template>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="actions-cell">  </th>
                <td mat-cell *matCellDef="let element; let i = index" class="actions-cell">
                    <button mat-stroked-button aria-label="Edit this overlay" (click)="enableOverlayEdit(element.overlayId)" matTooltip="Edit this overlay" matTooltipShowDelay="500" matTooltipPosition="above">Edit</button>
                    <span class="test-wrap" [matTooltip]="canSendTest( element.overlayType ) ? 'Send test: show a sample timer or text on this overlay.' : 'There is no sample for this overlay type.'" matTooltipShowDelay="500" matTooltipPosition="above">
                        <button mat-icon-button aria-label="Send test" [disabled]="!canSendTest( element.overlayType )" (click)="sendTest( element )"><mat-icon>play_arrow</mat-icon></button>
                    </span>
                    <button mat-icon-button aria-label="More actions for this overlay" [matMenuTriggerFor]="rowMenu" [matMenuTriggerData]="{ overlay: element, index: i }"><mat-icon>more_vert</mat-icon></button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['name', 'type', 'assignCount', 'actions']"></tr>
            <tr mat-row *matRowDef="let element; columns: ['name', 'type', 'assignCount', 'actions'];" [class.selected-row]="element.overlayId === selectedOverlayId" (click)="selectedOverlayId = element.overlayId"></tr>

        </table>

        <mat-menu #rowMenu="matMenu" class="trigger-main-menu">
            <ng-template matMenuContent let-overlay="overlay" let-index="index">
                <button mat-menu-item (click)="sendToOrigin( overlay.overlayId )" matTooltip="Send overlay to the middle of the selected monitor." matTooltipPosition="left">
                    <mat-icon>filter_center_focus</mat-icon>
                    <span>Center on monitor</span>
                </button>
                <button mat-menu-item (click)="deleteOverlay( index )">
                    <mat-icon>delete</mat-icon>
                    <span>Delete</span>
                </button>
            </ng-template>
        </mat-menu>
    </div>
</div>
