<mat-toolbar>
    <span>Overlays</span>
    <span class="spacer"></span>
    <button mat-button color="default" class="color-blue" (click)="arrangeOverlays()"><mat-icon class="material-icons-outlined">view_quilt</mat-icon> Arrange Overlays</button>
    <button mat-button color="accent" (click)="showNewOverlayDialog()"><mat-icon class="material-icons-outlined">layers</mat-icon> New Overlay</button>
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="trigger-main-menu">
        <button mat-menu-item (click)="findMissingOverlays()" matTooltip="Will find any references to overlays that do not exist in your list of overlays." matTooltipPosition="left">
            <span>Find Missing Overlays</span>
        </button>
    </mat-menu>
</mat-toolbar>
<div class="tab-content">

    <div class="empty-state" *ngIf="overlaysLoaded && overlays?.length === 0">
        <h2>No overlays yet</h2>
        <p>Overlays are the windows on your screen where trigger text, timers and bars show up.</p>
        <button mat-button color="accent" (click)="showNewOverlayDialog()"><mat-icon class="material-icons-outlined">layers</mat-icon> New Overlay</button>
    </div>

    <table mat-table #overlaysTable="matTable" style="width: 100%;" *ngIf="overlays?.length > 0"
        [dataSource]="overlays">

        <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 280px;">  </th>
            <td mat-cell *matCellDef="let element; let i = index" style="text-align: center; width: 280px; white-space: nowrap;">
                <button mat-button color="accent" aria-label="Edit this overlay" (click)="enableOverlayEdit(element.overlayId)" matTooltip="Edit this overlay" matTooltipShowDelay="500" matTooltipPosition="above"><mat-icon>display_settings</mat-icon> Edit</button>
                <button mat-button color="accent" aria-label="Centre this overlay on a monitor" (click)="sendToOrigin(element.overlayId)" matTooltip="Send overlay to the middle of the selected monitor." matTooltipShowDelay="500" matTooltipPosition="right"><mat-icon>filter_center_focus</mat-icon> Centre on monitor</button>
            </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef style="padding-left: 15px;"> Name </th>
            <td mat-cell *matCellDef="let element; let i = index" style="padding-left: 15px;"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef style="padding-left: 15px;"> Type </th>
            <td mat-cell *matCellDef="let element; let i = index" style="padding-left: 15px;"> {{getOverlayTypeLabel(element.overlayType)}} </td>
        </ng-container>

        <ng-container matColumnDef="assignCount">
            <th mat-header-cell *matHeaderCellDef style="padding-right: 15px; text-align: right;"> Use Count </th>
            <td mat-cell *matCellDef="let element; let i = index" style="padding-right: 15px; text-align: right;">
                <ng-template [ngIf]="element.overlayType === 'FCT'" [ngIfElse]="normalOverlay">&ndash;</ng-template>
                <ng-template #normalOverlay>{{overlayAssignCounts[element.overlayId] ?? 0}}</ng-template>
            </td>
        </ng-container>

        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 50px; padding-left: 15px;">  </th>
            <td mat-cell *matCellDef="let element; let i = index" style="text-align: center; width: 50px; padding-left: 15px;">
                <button mat-icon-button color="warn" aria-label="Delete this overlay" (click)="deleteOverlay(i)">
                    <mat-icon>clear</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['edit', 'name', 'type', 'assignCount', 'delete']"></tr>
        <tr mat-row *matRowDef="let element; columns: ['edit', 'name', 'type', 'assignCount', 'delete'];"></tr>

    </table>
</div>
