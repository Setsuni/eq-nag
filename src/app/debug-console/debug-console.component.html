<div class="debug-console-container" *ngIf="show" nagResizeable location="top" resizeVisibility="hidden" resizeMax="80%" #container>
    <div class="console-toolbar">
        <div class="view-switch" role="group" aria-label="Console view">
            <button mat-button class="view-button" [ngClass]="{'selected': !developer}" (click)="developer = false" matTooltip="Trigger matches and status messages">Activity</button>
            <button mat-button class="view-button" [ngClass]="{'selected': developer}" (click)="developer = true" matTooltip="Everything the app logs, with a command prompt">Developer log</button>
        </div>

        <mat-form-field>
            <mat-label></mat-label>
            <mat-select [(ngModel)]="characterId" name="characterId" placeholder="Character" matTooltip="Filters trigger matches; app messages always show">
                <mat-option [value]="null">All Characters</mat-option>
                <mat-option *ngFor="let option of characterOptions" [value]="option.id">{{option.server}} | {{option.name}}</mat-option>
            </mat-select>
        </mat-form-field>

        <div *ngIf="consoleList.showTriggerHistory">
            <button mat-button (click)="hideTriggerHistory()">{{consoleList.triggerName}} <mat-icon [inline]="true">clear</mat-icon></button>
            <button mat-button class="color-red" *ngIf="developer" [ngClass]="{'selected': consoleList.parseType === 'failed'}" (click)="setParseType('failed')">Failed</button>
            <button mat-button class="color-green" [ngClass]="{'selected': consoleList.parseType === 'successful'}" (click)="setParseType('successful')">Success</button>
            <button mat-button class="color-bright-white" (click)="showEditTriggerDialog()">Edit Trigger</button>
        </div>

        <button mat-button class="problems-button" *ngIf="!developer && problemCount > 0" (click)="developer = true" matTooltip="Open the Developer log">{{problemCount}} {{problemCount === 1 ? 'problem' : 'problems'}} – see Developer log</button>

        <span style="flex: 1 1 auto;"></span>

        <mat-form-field class="filter-field" floatLabel="never">
            <input matInput type="text" placeholder="Filter" aria-label="Filter" [ngModel]="searchText" (ngModelChange)="onSearchTextChanged($event)" name="searchText" />
            <mat-icon matPrefix style="opacity: 0.5;">search</mat-icon>
        </mat-form-field>

        <button mat-icon-button class="icon-action" (click)="clear()" matTooltip="Clear" aria-label="Clear"><mat-icon>delete_sweep</mat-icon></button>
        <button mat-icon-button class="icon-action" (click)="copyLog()" *ngIf="developer" matTooltip="Copy the whole developer log, ignoring the search and filters, to paste into a support request" aria-label="Copy whole log"><mat-icon>content_copy</mat-icon></button>
        <button mat-icon-button class="icon-action" (click)="show = false" matTooltip="Hide" aria-label="Hide"><mat-icon>expand_more</mat-icon></button>

    </div>

    <console-list #consoleList [searchText]="appliedSearchText" [characterId]="characterId" [developer]="developer" (onListUpdated)="onListUpdated($event.scrollBottom, $event.problemCount)"></console-list>

    <div class="activity-empty" *ngIf="!developer && consoleList.history.length === 0">
        No trigger matches yet. When a trigger fires it shows up here. Problems and technical messages are in the Developer log.
    </div>

    <div class="activity-empty" *ngIf="developer && consoleList.history.length === 0">
        Nothing logged yet.
    </div>

    <div class="console-bottom-buttons" *ngIf="showBottomTools">
        <button mat-button (click)="scrollToBottom()" *ngIf="!atBottom">Jump to bottom</button>
    </div>

    <div class="console-input-area" *ngIf="showInput">
        <span>></span><input type="text" [(ngModel)]="consoleCommand" name="consoleCommand" (keyup.enter)="sendConsoleCommand()" />
    </div>
    
</div>
<div class="debug-toggle" *ngIf="!show">
    <console-list class="count-only" [countOnly]="true" (onListUpdated)="onListUpdated(false, $event.problemCount)"></console-list>
    <button mat-button (click)="show = true"><mat-icon [inline]="true">notes</mat-icon> Activity<span class="problem-dot" *ngIf="problemCount > 0" [matTooltip]="problemCount + ( problemCount === 1 ? ' problem' : ' problems' )">{{problemCount}}</span></button>
</div>
