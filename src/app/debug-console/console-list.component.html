<ng-template ngFor let-item [ngForOf]="countOnly ? [] : history" [ngForTrackBy]="trackByFn">

    <div [ngSwitch]="getLogType(item)">
        <ng-template [ngSwitchCase]="'progress'">
            <console-progress [item]="item"></console-progress>
        </ng-template>
        <ng-template [ngSwitchCase]="'trigger'">
            <console-trigger-event [item]="asTriggerParseHistoryModel(item)" [developer]="developer" (showTriggerHistory)="showTriggerParseHistory($event.triggerId, $event.triggerName)"></console-trigger-event>
        </ng-template>
        <ng-template [ngSwitchCase]="'message'">
            <console-message [item]="item" [developer]="developer"></console-message>
        </ng-template>
    </div>

</ng-template>
