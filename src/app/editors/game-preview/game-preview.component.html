<div class="game-preview-container-container">
    <div class="game-preview-container" [ngClass]="{'light': background === 'light', 'dark': background === 'dark'}">
        <div class="preview-background-options">
            <button type="button" [class.selected]="background === 'light'" [attr.aria-pressed]="background === 'light'" (click)="background = 'light'">Light</button>
            <button type="button" [class.selected]="background === 'dark'" [attr.aria-pressed]="background === 'dark'" (click)="background = 'dark'">Dark</button>
        </div>
        <ng-content></ng-content>
    </div>
</div>
