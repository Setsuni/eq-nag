<div class="duration-wrapper">
    <div class="time-element">
        <input type="number" [(ngModel)]="hours" [disabled]="disabled" (change)="valueChanged($event)" aria-label="Hours" />
        <span>Hrs</span>
        <div class="spinners">
            <button mat-icon-button type="button" class="spinner" (click)="hours = add(hours)" [disabled]="disabled" aria-label="More hours"><mat-icon [inline]="true">add</mat-icon></button>
            <button mat-icon-button type="button" class="spinner" (click)="hours = subtract(hours)" [disabled]="hours == null || disabled" aria-label="Fewer hours"><mat-icon [inline]="true">remove</mat-icon></button>
        </div>
    </div>

    <div class="time-element">
        <input type="number" [(ngModel)]="minutes" [disabled]="disabled" (change)="valueChanged($event)" aria-label="Minutes" />
        <span>Mins</span>
        <div class="spinners">
            <button mat-icon-button type="button" class="spinner" (click)="minutes = add(minutes)" [disabled]="disabled" aria-label="More minutes"><mat-icon [inline]="true">add</mat-icon></button>
            <button mat-icon-button type="button" class="spinner" (click)="minutes = subtract(minutes)" [disabled]="minutes == null || disabled" aria-label="Fewer minutes"><mat-icon [inline]="true">remove</mat-icon></button>
        </div>
    </div>

    <div class="time-element">
        <input type="number" [(ngModel)]="seconds" [disabled]="disabled" (change)="valueChanged($event)" aria-label="Seconds" />
        <span>Sec</span>
        <div class="spinners">
            <button mat-icon-button type="button" class="spinner" (click)="seconds = add(seconds)" [disabled]="disabled" aria-label="More seconds"><mat-icon [inline]="true">add</mat-icon></button>
            <button mat-icon-button type="button" class="spinner" (click)="seconds = subtract(seconds)" [disabled]="seconds == null || disabled" aria-label="Fewer seconds"><mat-icon [inline]="true">remove</mat-icon></button>
        </div>
    </div>

</div>
