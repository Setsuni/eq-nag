
<h2 mat-dialog-title>Conditions for {{title}}</h2>

<mat-dialog-content>
    <app-conditions [(conditions)]="conditions" [lighter]="true"></app-conditions>
</mat-dialog-content>

<mat-dialog-actions>
    
    <button mat-stroked-button (click)="cancel()" class="t-confirm-no">Cancel</button>
    <button mat-flat-button color="primary" (click)="confirm()" class="t-confirm-yes">Save</button>

</mat-dialog-actions>
