<div class="modal">
    <header>
        <mat-toolbar class="titlebar" color="default">
            <span>Update notes<ng-container *ngIf="versionNumber"> · v{{versionNumber}}</ng-container></span>
            <span class="spacer"></span>
            <button mat-icon-button aria-label="Close" (click)="close()">
                <mat-icon>clear</mat-icon>
            </button>
        </mat-toolbar>
    </header>
    <section>
        <div class="update-notes">
            <markdown [data]="updateNotes"></markdown>
        </div>
    </section>
    <footer>
        <button mat-stroked-button (click)="close()">Close</button>
    </footer>
</div>
