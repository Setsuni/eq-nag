<h2 mat-dialog-title>{{title}}</h2>

<mat-dialog-content *ngIf="messages.length > 0">

    <p *ngFor="let msg of messages" [innerHtml]="msg | coloredString"></p>

</mat-dialog-content>

<mat-dialog-actions>

    <ng-template [ngIf]="data.moreInfo != null">
        <button mat-button class="color-blue" (click)="data.moreInfo()">More info</button>
        <span style="flex: 1 1 auto;"></span>
    </ng-template>
    <button mat-stroked-button [mat-dialog-close]="null" class="t-confirm-no" *ngIf="data.cancelMessage != null">{{cancelText}}</button>
    <button mat-stroked-button [mat-dialog-close]="false" class="t-confirm-no">{{noText}}</button>
    <button mat-flat-button [mat-dialog-close]="true" class="t-confirm-yes" [color]="destructive ? 'warn' : 'primary'">{{yesText}}</button>

</mat-dialog-actions>
