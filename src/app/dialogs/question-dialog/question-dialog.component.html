<h2 mat-dialog-title>{{title}}</h2>

<mat-dialog-content>

    <p *ngFor="let msg of messages" [innerHtml]="msg | coloredString"></p>
    <div class="btn-info">
        <table>
            <tr *ngFor="let q of data.questions">
                <td><strong>{{q.buttonText}}</strong></td>
                <td>
                    <div *ngFor="let msg of q.question"><span [innerHtml]="msg | coloredString"></span></div>
                </td>
            </tr>
            &nbsp;
        </table>
    </div>
</mat-dialog-content>

<mat-dialog-actions>

  <button mat-stroked-button mat-dialog-close class="t-confirm-no" *ngIf="data.cancellable">Cancel</button>
  <ng-container *ngFor="let q of answers">
    <button mat-flat-button color="primary" *ngIf="isPrimary(q)" (click)="executeAnswer(q)" class="t-confirm-yes">{{q.buttonText}}</button>
    <button mat-stroked-button *ngIf="!isPrimary(q)" (click)="executeAnswer(q)" class="t-confirm-yes">{{q.buttonText}}</button>
  </ng-container>

</mat-dialog-actions>
