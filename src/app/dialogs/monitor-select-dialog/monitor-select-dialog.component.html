<h2 mat-dialog-title>Choose a monitor</h2>

<mat-dialog-content>

    <p style="margin: 15px 0px 15px 0px; align-self: flex-start;" *ngFor="let msg of messages" [innerHtml]="msg | coloredString"></p>

    <app-display-selector [renderWidth]="renderWidth" [selectedMonitorId]="defaultDisplayId" (onMonitorSelect)="selectedDisplay = $event"></app-display-selector>

</mat-dialog-content>

<mat-dialog-actions>
    
    <button mat-stroked-button (click)="cancel()" class="t-confirm-no">Cancel</button>
    <button mat-flat-button color="primary" (click)="accept()" class="t-confirm-yes">Select</button>

</mat-dialog-actions>
