<h2 mat-dialog-title>DoT timer from a spell</h2>

<mat-dialog-content>

    <p *ngIf="data?.trigger?.triggerId != null">WARNING: This may overwrite any custom setting you have applied to this trigger.  Are you sure you want to continue?</p>

    <mat-stepper [linear]="true" #stepper>
        <mat-step [stepControl]="stepOneForm.control" label="Find the spell">
            <form #stepOneForm="ngForm">
                <mat-form-field floatLabel="always" style="width: 100%;">
                    <mat-label>{{serviceName}} URL</mat-label>
                    <input matInput type="text" [(ngModel)]="url" name="url" required />
                </mat-form-field>
            </form>
        </mat-step>
        <mat-step [stepControl]="stepTwoForm.control" label="Tracking">
            <form #stepTwoForm="ngForm">

                <mat-form-field floatLabel="always" style="width: 50%;">
                    <mat-label>Overlay window</mat-label>
                    <mat-select [(ngModel)]="overlayId" name="ddlDotTimerOverlay" required>
                        <mat-option *ngFor="let option of timerOverlays" [value]="option.overlayId">{{option.name}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <p><mat-checkbox [(ngModel)]="onlyExecuteForRareEqTargets" name="onlyExecuteForRareEqTargets">Only execute for rare and raid targets</mat-checkbox></p>
                <p><mat-checkbox [(ngModel)]="cancelTimerIfTargetDies" name="cancelTimerIfTargetDies">End timer early if your target dies</mat-checkbox></p>

            </form>
        </mat-step>
        <mat-step label="Import">
            <p>Ready to import.</p>
        </mat-step>
    </mat-stepper>
</mat-dialog-content>

<mat-dialog-actions>

  <button mat-stroked-button mat-dialog-close class="t-confirm-no">Cancel</button>
  <button mat-stroked-button *ngIf="stepIndex > 0" (click)="stepper.previous()">Back</button>
  <button mat-flat-button color="primary" class="t-confirm-yes" [disabled]="nextDisabled" (click)="next()">{{ isLastStep ? 'Import' : 'Next' }}</button>

</mat-dialog-actions>
