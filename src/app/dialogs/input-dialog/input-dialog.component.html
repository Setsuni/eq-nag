<h2 mat-dialog-title>{{(data.title == null ? 'Information required' : data.title)}}</h2>

<mat-dialog-content>

    <p *ngFor="let msg of messages">{{msg}}</p>

    <mat-form-field floatLabel="always" *ngIf="!data.useTextArea">
        <mat-label *ngIf="data.hint != null || data.label != null">{{data.label ? data.label : data.hint}}</mat-label>
        <input matInput [(ngModel)]="model" />
        <mat-hint *ngIf="data.hint != null && data.label != null">{{data.hint}}</mat-hint>
    </mat-form-field>

    <mat-form-field floatLabel="always" *ngIf="data.useTextArea">
        <mat-label *ngIf="data.hint != null || data.label != null">{{data.label ? data.label : data.hint}}</mat-label>
        <textarea matInput [(ngModel)]="model" style="width: 100%" rows="10"></textarea>
        <mat-hint *ngIf="data.hint != null && data.label != null">{{data.hint}}</mat-hint>
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions>
    
    <button mat-stroked-button (click)="cancel()" class="t-confirm-no">Cancel</button>
    <button mat-flat-button color="primary" (click)="accept()" class="t-confirm-yes">{{data.acceptText ?? 'Continue'}}</button>

</mat-dialog-actions>
